{% load static %}<!DOCTYPE html>
<html lang="es" class="bg-background scroll-smooth" data-theme="{% if user.is_authenticated %}{{ user.theme }}{% else %}system{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nexo · Gestión de tu negocio{% endblock %}</title>
    <script>
        (function () {
            var pref = document.documentElement.dataset.theme || "system";
            var stored = null;
            try { stored = localStorage.getItem("nexo-theme"); } catch (e) {}
            if (["light", "dark", "system"].indexOf(stored) !== -1) pref = stored;
            var mq = window.matchMedia("(prefers-color-scheme: dark)");
            function apply() {
                var dark = pref === "dark" || (pref === "system" && mq.matches);
                document.documentElement.classList.toggle("dark", dark);
            }
            apply();
            if (mq.addEventListener) mq.addEventListener("change", apply);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link rel="stylesheet" href="{% static 'css/nexo.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-background text-on-surface">
    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
